<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Squircle Base with Glow -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#pgrad)" filter="url(#glow)"/>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- 3x3 Grid of Rounded White Dots -->
  <circle cx="20" cy="20" r="3.5" fill="#ffffff" />
  <circle cx="32" cy="20" r="3.5" fill="#ffffff" />
  <circle cx="44" cy="20" r="3.5" fill="#ffffff" />
  <circle cx="20" cy="32" r="3.5" fill="#ffffff" />
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  <circle cx="44" cy="32" r="3.5" fill="#ffffff" />
  <circle cx="20" cy="44" r="3.5" fill="#ffffff" />
  <circle cx="32" cy="44" r="3.5" fill="#ffffff" />
  <circle cx="44" cy="44" r="3.5" fill="#ffffff" />
</svg>
