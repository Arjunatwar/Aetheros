---
# AETHER OS Calamares Users Module Configuration
defaultGroups:
    - video
    - audio
    - cdrom
    - floppy
    - sudo
    - dip
    - plugdev
    - netdev
    - lpadmin
    - scanner

autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: true

# Disable restrictive password checks to prevent dictionary load failures
checkPasswordRequirements: false
allowWeakPasswords: true
allowWeakPasswordsDefault: true
