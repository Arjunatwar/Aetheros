---
# AETHER OS Calamares Grubcfg Module Configuration
overwrite: true
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet", "splash", "vmwgfx.enable_fbdev=1" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "0"
    GRUB_CMDLINE_LINUX_DEFAULT: "quiet splash vmwgfx.enable_fbdev=1"
    GRUB_DISTRIBUTOR: "AETHER OS"
    GRUB_DISABLE_SUBMENU: true
    GRUB_DISABLE_RECOVERY: false
